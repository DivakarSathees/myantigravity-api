[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-antigravity"
version = "0.1.0"
description = "AI-powered coding agent and project generator"
authors = [ { name = "autogen" } ]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "langchain-google-genai",
    "langgraph",
    "langchain-openai",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.scripts]
start-server = "server:app"
